# Stack completo de VidaSalud: cluster RabbitMQ de 2 nodos + BFF + los cuatro
# microservicios de dominio.
#
# Uso:   docker compose up -d --build
#        ../mq/unir-cluster.sh        (una sola vez, tras el primer arranque)
#
# Los repositorios de codigo se clonan aparte. REPOS_PATH indica donde estan:
#   - en tu PC, son hermanos de infra/   -> no hace falta definirlo
#   - en la EC2, en /home/ec2-user       -> REPOS_PATH=/home/ec2-user en el .env
#
# Solo el BFF publica puerto al exterior (8080). Los microservicios usan
# "expose": se ven entre contenedores y no desde internet. Los puertos de
# RabbitMQ se publican para poder mostrar la consola en la presentacion.
services:

  # ---------------------------------------------------------------- mensajeria

  rabbit1:
    image: rabbitmq:3.13-management
    container_name: rabbit1
    hostname: rabbit1
    environment:
      # La cookie de Erlang tiene que ser identica en los dos nodos: es lo que
      # les permite reconocerse como parte del mismo cluster.
      RABBITMQ_ERLANG_COOKIE: ${ERLANG_COOKIE:-vidasalud-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-admin}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit1-data:/var/lib/rabbitmq
      - ../mq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../mq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [vidasalud]

  rabbit2:
    image: rabbitmq:3.13-management
    container_name: rabbit2
    hostname: rabbit2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${ERLANG_COOKIE:-vidasalud-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-admin}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbit2-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      - rabbit1
    restart: unless-stopped
    networks: [vidasalud]
    # La union al cluster la hace ../mq/unir-cluster.sh, no el compose:
    # "depends_on" asegura el orden de arranque del contenedor, no que Erlang
    # este listo para aceptar la conexion del otro nodo.

  # --------------------------------------------------------------------- borde

  bff:
    build: ${REPOS_PATH:-../..}/ms-vidasalud-bff
    container_name: vidasalud-bff
    ports:
      - "8080:8080"
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID}
      # Uno o varios origenes separados por coma.
      #
      # El respaldo se resuelve aqui y no en el application.yml del BFF: si
      # Compose pasara FRONTEND_ORIGINS como cadena vacia, Spring la tomaria
      # como definida, no caeria al valor por defecto y se quedaria sin ningun
      # origen permitido. El sintoma es un 403 "Invalid CORS request" que
      # parece un problema del API Gateway y no lo es.
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-${FRONTEND_ORIGIN:-http://localhost:4200}}
      INTERNAL_KEY: ${INTERNAL_KEY}
      MS_APPOINTMENTS_URL: http://appointments:8081
      MS_CATALOG_URL: http://catalog:8082
      MS_REPORT_URL: http://appointments:8081
      MS_AUDIT_URL: http://appointments:8081
      MS_NOTIFICATIONS_URL: http://notifications:8091
      MS_MQ_URL: http://rabbit-admin:8090
    depends_on:
      - appointments
      - catalog
      - notifications
      - rabbit-admin
    restart: unless-stopped
    networks: [vidasalud]

  # ------------------------------------------------------ servicios de dominio

  appointments:
    build: ${REPOS_PATH:-../..}/ms-vidasalud-appointments
    container_name: vidasalud-appointments
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:-dev}
      INTERNAL_KEY: ${INTERNAL_KEY}
      DB_APPOINTMENTS_URL: ${DB_APPOINTMENTS_URL}
      DB_APPOINTMENTS_USER: ${DB_APPOINTMENTS_USER}
      DB_APPOINTMENTS_PASSWORD: ${DB_APPOINTMENTS_PASSWORD}
      # Este servicio no habla AMQP: anuncia los hechos por HTTP al
      # microservicio de mensajeria, que es quien los convierte en mensajes.
      MS_MQ_URL: http://rabbit-admin:8090
    restart: unless-stopped
    networks: [vidasalud]

  catalog:
    build: ${REPOS_PATH:-../..}/ms-vidasalud-catalog
    container_name: vidasalud-catalog
    expose:
      - "8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${DB_PROFILE:-dev}
      INTERNAL_KEY: ${INTERNAL_KEY}
      DB_CATALOG_URL: ${DB_CATALOG_URL}
      DB_CATALOG_USER: ${DB_CATALOG_USER}
      DB_CATALOG_PASSWORD: ${DB_CATALOG_PASSWORD}
    restart: unless-stopped
    networks: [vidasalud]

  # Envia los avisos a los pacientes. Sin base de datos y sin AMQP: el envio
  # lo dispara el microservicio de mensajeria por HTTP.
  notifications:
    build: ${REPOS_PATH:-../..}/ms-vidasalud-notifications
    container_name: vidasalud-notifications
    expose:
      - "8091"
    environment:
      INTERNAL_KEY: ${INTERNAL_KEY}
    restart: unless-stopped
    networks: [vidasalud]

  # El UNICO servicio que habla AMQP. Se hace cargo de toda la mensajeria:
  # declara la topologia, publica los eventos y consume las tres colas. Cuando
  # consume un mensaje no ejecuta logica de negocio: llama por HTTP al duenio
  # de esos datos, de modo que cada base sigue teniendo un unico duenio.
  #
  # Habla con el broker por dos vias: AMQP (5672) para declarar, publicar y
  # consumir, y la API de management (15672) para consultar lo que existe.
  rabbit-admin:
    build: ${REPOS_PATH:-../..}/ms-vidasalud-rabbit-admin
    container_name: vidasalud-rabbit-admin
    expose:
      - "8090"
    environment:
      INTERNAL_KEY: ${INTERNAL_KEY}
      RABBIT_HOST: rabbit1
      RABBIT_PORT: 5672
      RABBIT_MANAGEMENT_URL: http://rabbit1:15672
      RABBIT_ADDRESSES: rabbit1:5672,rabbit2:5672
      RABBIT_USER: ${RABBIT_USER:-admin}
      RABBIT_PASS: ${RABBIT_PASS:-admin}
      # Destinos del trabajo que llega por las colas.
      MS_APPOINTMENTS_URL: http://appointments:8081
      MS_CATALOG_URL: http://catalog:8082
      MS_NOTIFICATIONS_URL: http://notifications:8091
    depends_on:
      rabbit1:
        condition: service_healthy
    restart: unless-stopped
    networks: [vidasalud]

volumes:
  rabbit1-data:
  rabbit2-data:

networks:
  vidasalud:
    driver: bridge
